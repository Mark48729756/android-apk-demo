name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project zip
        run: |
          unzip -oq BR_Graphics_project_*.zip
          rm -rf brgfx/.github
          cp -r brgfx/. .
      - name: Show repo files
        run: |
          ls -la
          ls -R src module | head -50
          test -f CMakeLists.txt && test -f src/main.cpp && test -f src/zygisk.hpp
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build both ABIs
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          mkdir -p module/zygisk
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S . -B build/$abi -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$abi -j
            cp build/$abi/libbrgfx.so module/zygisk/$abi.so
          done
          cd module && zip -r ../BR_Graphics.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: BR_Graphics
          path: BR_Graphics.zip
