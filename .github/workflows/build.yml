
name: Veil Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veil APK and Module
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check environment
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Package Veil module
        run: |
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk \
            module/system/app/DepthParallax/DepthParallax.apk

          cd module
          zip -qr ../Veil-module.zip . -x './.git/*'
          cd ..

          unzip -t Veil-module.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Veil-Build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            Veil-module.zip
          if-no-files-found: error
          retention-days: 14
