name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack project archive and locate source
        run: |
          unzip -o RageLauncher_step1.zip -d extracted_project
          
          # Ищем папку, в которой лежит gradlew, и переносим её содержимое в корень
          PROJECT_DIR=$(find extracted_project -name "gradlew" -exec dirname {} \;)
          
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found project at: $PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* ./
          else
            echo "Error: gradlew not found in the archive!"
            exit 1
          fi
          
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RageLauncher-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
