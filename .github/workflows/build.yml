name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Archive
        run: |
          if [ -f "Veil_project_v0_6.zip" ]; then
            unzip -o Veil_project_v0_6.zip -d extracted_project
          fi

      - name: Auto-fix SettingsActivity Kotlin Error via Python
        run: |
          python3 -c '
          import glob, re
          files = glob.glob("extracted_project/**/SettingsActivity.kt", recursive=True)
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              if len(lines) >= 135:
                  idx = 134
                  print(f"=== BEFORE LINE 135 ===")
                  print(lines[idx].rstrip())
                  
                  # Меняем val на var независимо от пробелов
                  lines[idx] = re.sub(r"\bval\s+", "var ", lines[idx])
                  
                  # Исправляем integer literal на float (например, присваивание целого числа в float-переменную)
                  # Ищем шаблон вроде "= 10" или "=10" и превращаем в "= 10.0f"
                  lines[idx] = re.sub(r"=\s*([0-9]+)(\s*(?://.*|/\*.*|\)|$))", r"= \1.0f\2", lines[idx])
                  
                  print(f"=== AFTER LINE 135 ===")
                  print(lines[idx].rstrip())
                  
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
          '

      - name: Build Debug APK
        run: |
          cd extracted_project
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          cd extracted_project
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
