name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Archive
        run: |
          if [ -f "Veil_project_v0_6.zip" ]; then
            unzip -o Veil_project_v0_6.zip -d extracted_project
          fi

      - name: Auto-fix SettingsActivity Kotlin Error via Python
        run: |
          python3 -c '
          import glob
          files = glob.glob("extracted_project/**/SettingsActivity.kt", recursive=True)
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              if len(lines) >= 135:
                  # Смотрим, что на 135 строке (индекс 134), и меняем val на var либо фиксим присвоение
                  line = lines[134]
                  print(f"Original line 135: {line.strip()}")
                  # Заменяем val на var и приводим к рабочему виду
                  line = line.replace("val ", "var ")
                  lines[134] = line
                  print(f"Fixed line 135: {lines[134].strip()}")
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
          '

      - name: Build Debug APK
        run: |
          cd extracted_project
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          cd extracted_project
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
