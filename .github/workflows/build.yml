name: Veil Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veil APK and Module
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Download repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Find actual Android project directory
      - name: Detect project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          for candidate in \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/veil_v13_work"
          do
            if [ -f "$candidate/settings.gradle.kts" ] && \
               [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r settings_file; do
              candidate="${settings_file%/settings.gradle.kts}"

              if [ -f "$candidate/app/build.gradle.kts" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 5 \
                -type f \
                -name settings.gradle.kts \
                -not -path '*/.git/*'
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found."
            echo "Expected settings.gradle.kts and app/build.gradle.kts."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 4. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # 5. Install compatible Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d module

      # 6. Validate JavaScript and shell scripts
      - name: Validate source scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("module/webroot/index.html")
          if not html_path.is_file():
              raise SystemExit("WebUI index.html not found")

          html = html_path.read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              re.S | re.I
          )

          if not scripts:
              raise SystemExit("No inline JavaScript found")

          for i, script in enumerate(scripts):
              Path(f"/tmp/veil-{i}.mjs").write_text(
                  script,
                  encoding="utf-8"
              )

          print(f"Found {len(scripts)} inline JavaScript blocks")
          PY

          for file in /tmp/veil-*.mjs; do
            test -f "$file"
            node --check "$file"
          done

          for file in module/*.sh module/META-INF/com/google/android/update-binary; do
            if [ -f "$file" ]; then
              sh -n "$file"
            fi
          done

      # 7. Compile Android application
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      # 9. Package Magisk / KernelSU module
      - name: Package Veil module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p module/system/app/DepthParallax

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            module/system/app/DepthParallax/DepthParallax.apk

          cd module

          zip -qr "$GITHUB_WORKSPACE/Veil-module.zip" . \
            -x './.git/*'

          unzip -t "$GITHUB_WORKSPACE/Veil-module.zip"

          test -s "$GITHUB_WORKSPACE/Veil-module.zip"

          ls -lh "$GITHUB_WORKSPACE/Veil-module.zip"

      # 10. Upload APK and module ZIP
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Veil-Build
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            Veil-module.zip
          if-no-files-found: error
          retention-days: 14
