name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: unzip -q BR_Graphics_project*.zip -d pkg
      - name: Build
        run: |
          cd pkg/brgfx
          mkdir -p module/zygisk
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S . -B build/$abi -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$abi -j
            cp build/$abi/libbrgfx.so module/zygisk/$abi.so
          done
          cd module && zip -r ../../../BR_Graphics.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: BR_Graphics
          path: BR_Graphics.zip
