name: Veil Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Veil APK and Module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Получаем репозиторий
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Находим и распаковываем ZIP проекта
      - name: Extract Veil project
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          ARCHIVE=""

          if [ -f "Veil_v1_4_Sharp_Preview.zip" ]; then
            ARCHIVE="$GITHUB_WORKSPACE/Veil_v1_4_Sharp_Preview.zip"
          else
            mapfile -t ARCHIVES < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -iname '*.zip' \
                ! -name 'Veil-module.zip'
            )

            if [ "${#ARCHIVES[@]}" -ne 1 ]; then
              echo "::error::Expected Veil_v1_4_Sharp_Preview.zip or exactly one project ZIP."
              printf '%s\n' "${ARCHIVES[@]}"
              exit 1
            fi

            ARCHIVE="${ARCHIVES[0]}"
          fi

          echo "Using archive: $ARCHIVE"

          unzip -t "$ARCHIVE"

          SOURCE_ROOT="$GITHUB_WORKSPACE/.veil-source"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"

          unzip -q "$ARCHIVE" -d "$SOURCE_ROOT"

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$SOURCE_ROOT" \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find Android Gradle project inside ZIP."
            find "$SOURCE_ROOT" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project detected:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # 3. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0"

      # 5. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 6. Проверка проекта
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -d module
          test -f module/module.prop
          test -f module/webroot/index.html

          java -version
          gradle --version

          echo "Project validation successful."

      # 7. Проверка WebUI
      - name: Validate WebUI JavaScript
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("module/webroot/index.html")
          html = html_path.read_text(encoding="utf-8")

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              re.S | re.I
          )

          if not scripts:
              raise SystemExit("No JavaScript blocks found")

          for index, script in enumerate(scripts):
              Path(f"/tmp/veil-{index}.js").write_text(
                  script,
                  encoding="utf-8"
              )

          print(f"Found {len(scripts)} JavaScript blocks")
          PY

          for file in /tmp/veil-*.js; do
            node --check "$file"
          done

      # 8. Проверка shell-скриптов
      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            bash -n "$file"
          done < <(
            find module -type f \
              \( -name '*.sh' -o -name 'update-binary' \) \
              -print0
          )

      # 9. Сборка APK
      - name: Build Veil APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 10. Проверка APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK not found or empty"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Veil-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/Veil-debug.apk"

      # 11. Упаковка Magisk / KernelSU
      - name: Package Veil module
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p module/system/app/DepthParallax

          cp \
            "$GITHUB_WORKSPACE/Veil-debug.apk" \
            module/system/app/DepthParallax/DepthParallax.apk

          cd module

          zip -qr "$GITHUB_WORKSPACE/Veil-module.zip" .

          unzip -t "$GITHUB_WORKSPACE/Veil-module.zip"

          test -s "$GITHUB_WORKSPACE/Veil-module.zip"

          ls -lh "$GITHUB_WORKSPACE/Veil-module.zip"

      # 12. Загрузка готовых файлов
      - name: Upload Veil artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Veil-Build
          path: |
            Veil-debug.apk
            Veil-module.zip
          if-no-files-found: error
          retention-days: 14
