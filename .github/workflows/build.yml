name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Archive
        run: |
          if [ -f "Veil_project_v0_6.zip" ]; then
            unzip -o Veil_project_v0_6.zip -d extracted_project
          fi

      - name: Auto-fix SettingsActivity Kotlin Error
        run: |
          FILE_PATH=$(find extracted_project -name "SettingsActivity.kt")
          if [ -f "$FILE_PATH" ]; then
            echo "Found SettingsActivity.kt at $FILE_PATH"
            # Меняем val на var и гарантируем правильный тип Float на 135 строке
            sed -i '135s/val /var /' "$FILE_PATH"
            # Исправляем integer literal для Float (добавляем .0f или f к числу на 135 строке, если требуется)
            sed -i '135s/\(= *[0-9]\+\)[^0-9.]/\1.0f/' "$FILE_PATH" || true
          fi

      - name: Build Debug APK
        run: |
          cd extracted_project
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          cd extracted_project
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
