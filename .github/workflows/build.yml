name: Build Lumio
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Скачать проект из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download src -R ${{ github.repository }} -p "lawnchair-oneui-full.1.zip"
          unzip -q lawnchair-oneui-full.1.zip
      - name: Git-репозиторий для сборки (build.gradle читает commit)
        working-directory: lawnchair-nightly
        run: |
          git init -q
          git -c user.email=ci@lumio.local -c user.name=ci commit -q --allow-empty -m "Lumio build"
          git rev-parse --short=7 HEAD
      - name: Ключ подписи
        working-directory: lawnchair-nightly
        run: |
          keytool -genkeypair -keystore lumio-release.jks -alias lumio -keyalg RSA -keysize 2048 -validity 36500 -storepass lumio2026 -keypass lumio2026 -dname "CN=Lumio Launcher, O=Lumio, C=KZ"
          printf 'storeFile=lumio-release.jks\nstorePassword=lumio2026\nkeyAlias=lumio\nkeyPassword=lumio2026\n' > keystore.properties
      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка
        working-directory: lawnchair-nightly
        run: |
          chmod +x gradlew
          ./gradlew assembleLawnWithQuickstepGithubRelease --no-daemon --console=plain > build.log 2>&1 || {
            echo "=============== ОШИБКА (главное) ==============="
            grep -n -B3 -A30 "What went wrong" build.log | head -120
            echo "=============== последние 40 строк ==============="
            tail -n 40 build.log
            exit 1
          }
      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find lawnchair-nightly/build/outputs/apk -name "*.apk" | head -n 1)
          gh release upload src "$APK#Lumio.apk" -R ${{ github.repository }} --clobber
