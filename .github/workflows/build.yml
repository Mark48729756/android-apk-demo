name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        # Укажи папку, где лежит build.gradle (если в корне — удали строчку working-directory)
        # working-directory: app
        run: gradle assembleDebug --no-daemon

      - name: Pack Module
        run: |
          mkdir -p module/system/app/DepthParallax
          # Если исходный APK собирается в подпапку, проверь правильность пути
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
