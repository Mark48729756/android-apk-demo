name: MIUXHook APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(ls MIUXHook-*.zip | sort -V | tail -1)
          echo "Беру архив: $ZIP"
          unzip -q -o "$ZIP" -d .
          ROOT=$(dirname "$(find . -maxdepth 3 -name settings.gradle.kts | head -1)")
          echo "Корень проекта: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miuxhook
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
