name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Archive
        run: |
          if [ -f "Veil_project_v0_6.zip" ]; then
            unzip -o Veil_project_v0_6.zip -d extracted_project
          fi

      - name: Auto-fix SettingsActivity Kotlin Error via Python
        run: |
          python3 -c '
          import glob, re
          files = glob.glob("extracted_project/**/SettingsActivity.kt", recursive=True)
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              if len(lines) >= 135:
                  idx = 134
                  print(f"ORIGINAL LINE 135: {repr(lines[idx])}")
                  
                  # 1. Меняем val на var
                  lines[idx] = lines[idx].replace("val ", "var ")
                  
                  # 2. Если в строке присваивается целое число там, где нужен Float, добавляем f
                  # Ищем шаблоны вроде "= 0" или "= 10" и превращаем в "= 0f" / "= 10f"
                  lines[idx] = re.sub(r"=\s*([0-9]+)(?!\.[0-9]|f|\w)", r"= \1f", lines[idx])
                  
                  print(f"FIXED LINE 135: {repr(lines[idx])}")
                  
              with open(path, "w", encoding="utf-8") as f:
                  f.writelines(lines)
          '

      - name: Build Debug APK
        run: |
          cd extracted_project
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          cd extracted_project
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
