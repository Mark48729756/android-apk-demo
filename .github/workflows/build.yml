name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }
      - name: Find Gradle project root
        run: |
          S=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle(.kts) not found"; find . -maxdepth 3 -not -path './.git/*'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon
      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" Gallery.apk
      - uses: actions/upload-artifact@v4
        with: { name: Gallery-apk, path: Gallery.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gallery build ${{ github.run_number }}
          files: Gallery.apk
          make_latest: true
