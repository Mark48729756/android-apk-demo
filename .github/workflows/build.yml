name: MIUXHook APK Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP=$(ls MIUXHook-*.zip | sort -V | tail -1)
          echo "Беру архив: $ZIP"
          unzip -q -o "$ZIP" -d .
          ROOT=$(dirname "$(find . -maxdepth 3 -name settings.gradle.kts | head -1)")
          echo "Корень проекта: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show errors (only on failure)
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          {
            echo '## Ошибки сборки'
            echo '```'
            grep -E '^e: |^e: file|error:|What went wrong|Could not|Unresolved|FAILED' build.log | sort -u | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miuxhook
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
