name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Project Archive and Build
        run: |
          # Распаковываем архив во временную папку или прямо в корень
          unzip -o Veil_project_v0_6.zip -d extracted_project
          cd extracted_project
          
          # Запускаем сборку
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          cd extracted_project
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../../Veil.zip . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
