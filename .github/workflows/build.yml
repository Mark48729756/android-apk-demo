name: build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          # Выводим структуру, чтобы на 100% увидеть, куда распаковался архив
          find . -maxdepth 3 -not -path '*/.*'
          
          # Находим точный путь к папке с settings.gradle.kts и переходим туда
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          echo "Target project dir: $PROJECT_DIR"
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: settings.gradle.kts not found!"
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Prepare Magisk Module and Pack ZIP
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -maxdepth 3 -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          mkdir -p module/system/app/DepthParallax
          cp app/build/outputs/apk/debug/app-debug.apk module/system/app/DepthParallax/DepthParallax.apk
          cd module && zip -r ../Veil.zip . -x '.*'
          mv ../Veil.zip ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: Veil-module
          path: Veil.zip
